[package]
name = "fuser-iouring"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "A FUSE filesystem library for Rust that drives /dev/fuse through io_uring"
license = "Apache-2.0"
repository = "https://github.com/sdslabs/fuser-iouring"
readme = "README.md"
keywords = ["fuse", "io-uring", "filesystem", "linux"]
categories = ["filesystem", "os::linux-apis"]
exclude = ["simplefs_tests.sh", ".gitignore"]

[dependencies]
libc = "0.2.178"
io-uring = "0.6"
tracing = "0.1"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tracing-subscriber = "0.3"
